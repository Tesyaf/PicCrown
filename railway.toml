[build]
builder = "nixpacks"

# Pakai Node.js versi 22 (cocok untuk Vite 7, Tailwind 4, React 19)
[phases.setup]
nixPkgs = [
  "nodejs_22",
  "pnpm",
  "php83",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.pgsql",
  "php83Extensions.fileinfo",
  "php83Extensions.mbstring",
  "php83Extensions.openssl",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip"
]

# Build frontend
[phases.build]
cmd = "pnpm install && pnpm run build"

# Serve Laravel dengan PHP FPM + built static files
[start]
cmd = "php artisan migrate --force && php -S 0.0.0.0:${PORT} -t public"
